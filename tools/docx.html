<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docx Editor - Single HTML</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #editor-root {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "@docx-editor.dev/react": "https://esm.sh/@docx-editor.dev/react"
      }
    }
  </script>
</head>
<body>

  <div id="editor-root"></div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { DocxEditor } from '@docx-editor.dev/react';

    function App() {
      // Estado opcional para manejar el archivo cargado
      const [file, setFile] = useState(null);

      return React.createElement('div', { className: 'w-full h-full flex flex-col' },
        // Barra superior simple
        React.createElement('header', { className: 'p-4 bg-slate-800 text-white flex justify-between items-center' },
          React.createElement('h1', { className: 'font-bold text-lg' }, 'Editor DOCX en Frontend'),
          React.createElement('span', { className: 'text-xs bg-green-500 text-black px-2 py-1 rounded font-semibold' }, '100% Client-Side')
        ),
        // Componente Editor
        React.createElement('div', { className: 'flex-1 relative' },
          React.createElement(DocxEditor, {
            value: file,
            onChange: (updatedFile) => setFile(updatedFile)
          })
        )
      );
    }

    // Inicializar React en el DOM
    const container = document.getElementById('editor-root');
    const root = createRoot(container);
    root.render(React.createElement(App));
  </script>
</body>
</html>
