<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docx Editor - Single HTML</title>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #editor-root {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Import Map con React bundle unificado -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0?dev",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
        "@docx-editor.dev/react": "https://esm.sh/@docx-editor.dev/react?deps=react@18.2.0"
      }
    }
  </script>

  <!-- Compilador Babel para el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="editor-root"></div>

  <!-- Note: type="text/babel" y data-type="module" para que Babel transpile import maps -->
  <script type="text/babel" data-type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import * as DocxEditorModule from '@docx-editor.dev/react';

    // Aseguramos obtener el componente sin importar cómo se exporte (default o named)
    const DocxEditor = DocxEditorModule.DocxEditor || DocxEditorModule.default || DocxEditorModule;

    function App() {
      const [file, setFile] = useState(null);

      return (
        <div className="w-full h-full flex flex-col">
          <header className="p-4 bg-slate-800 text-white flex justify-between items-center z-10">
            <h1 className="font-bold text-lg">Editor DOCX en Frontend</h1>
            <span className="text-xs bg-green-500 text-black px-2 py-1 rounded font-semibold">
              100% Client-Side
            </span>
          </header>
          
          <div className="flex-1 relative">
            <DocxEditor
              value={file}
              onChange={(updatedFile) => setFile(updatedFile)}
            />
          </div>
        </div>
      );
    }

    const container = document.getElementById('editor-root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
