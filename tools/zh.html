  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      z-index: 10;
    }
    .btn-level {
      background-color: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-level.active {
      background-color: #ffd700;
      color: #121212;
      border-color: #ffd700;
    }
    .card {
      text-align: center;
      padding: 20px;
      border-radius: 20px;
      background-color: #1e1e1e;
      width: 82vw;
      height: 82vw;
      max-width: 580px;
      max-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #333;
      gap: 10px;
      position: relative;
    }
    .badge {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 0.75rem;
      background-color: #333;
      color: #ff9800;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .hanzi {
      font-size: 4.2rem;
      font-weight: bold;
      color: #ffd700;
      line-height: 1.1;
    }
    .pinyin {
      font-size: 1.9rem;
      color: #00e676;
      font-weight: 500;
    }
    .francais {
      font-size: 1.5rem;
      color: #29b6f6;
      font-style: italic;
    }
    .counter {
      position: absolute;
      bottom: 15px;
      font-size: 0.8rem;
      color: #666;
    }
    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>

    let currentList = vocabulary;
    let currentIndex = 0;

    const hanziEl = document.getElementById("hanzi");
    const pinyinEl = document.getElementById("pinyin");
    const francaisEl = document.getElementById("francais");
    const badgeEl = document.getElementById("badge");
    const counterEl = document.getElementById("counter");

    function updateCard() {
      const item = currentList[currentIndex];
      hanziEl.textContent = item.hanzi;
      pinyinEl.textContent = item.pinyin;
      francaisEl.textContent = item.francais;
      badgeEl.textContent = item.level;
      counterEl.textContent = `${currentIndex + 1} / ${currentList.length}`;
    }

    function nextWord() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex + 1) % currentList.length;
      updateCard();
    }

    function prevWord() {
      if (currentList.length === 0) return;
      currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
      updateCard();
    }

    function filterLevel(level) {
      document.querySelectorAll(".btn-level").forEach(b => b.classList.remove("active"));
      
      if (level === "ALL") {
        currentList = vocabulary;
        document.getElementById("btn-all").classList.add("active");
      } else if (level === "HSK1") {
        currentList = vocabulary.filter(w => w.level === "HSK1");
        document.getElementById("btn-hsk1").classList.add("active");
      } else if (level === "HSK2") {
        currentList = vocabulary.filter(w => w.level === "HSK2");
        document.getElementById("btn-hsk2").classList.add("active");
      }
      
      currentIndex = 0;
      updateCard();
    }

    // --- MODO PANTALLA COMPLETA ---
    document.getElementById("card").addEventListener("click", () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) docEl.requestFullscreen();
        else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
      }
    });

    // --- GAMEPAD API (Gatillos L1 / R1) ---
    let prevL1State = false;
    let prevR1State = false;

    function pollGamepad() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];

      if (gp) {
        const l1Pressed = gp.buttons[4] && gp.buttons[4].pressed;
        const r1Pressed = gp.buttons[5] && gp.buttons[5].pressed;

        if (r1Pressed && !prevR1State) nextWord();
        if (l1Pressed && !prevL1State) prevWord();

        prevL1State = l1Pressed;
        prevR1State = r1Pressed;
      }

      requestAnimationFrame(pollGamepad);
    }

    // --- NAVEGACIÓN POR SWIPE (TÁCTIL) ---
    let touchStartX = 0;
    document.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
    document.addEventListener("touchend", e => {
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 40) nextWord();
      if (touchEndX > touchStartX + 40) prevWord();
    });

    // Inicializar
    updateCard();
    requestAnimationFrame(pollGamepad);
