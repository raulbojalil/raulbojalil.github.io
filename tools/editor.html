<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de texte riche</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #e2e2e0;
    --text: #1c1c1a;
    --muted: #6b6b68;
    --accent: #d97757;
    --accent-hover: #c4633f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  .doc-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  select, input[type=text] {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--panel);
  }
  button {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  button:hover { background: var(--bg); }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  button.primary:hover { background: var(--accent-hover); }

  .toolbar {
    display: flex;
    gap: 4px;
    padding: 8px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar button {
    min-width: 34px;
    font-weight: 600;
  }
  .toolbar .sep {
    width: 1px;
    background: var(--border);
    margin: 4px 6px;
  }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .editor-pane {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    justify-content: center;
  }
  #editor {
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px 48px;
    min-height: 500px;
    outline: none;
    line-height: 1.6;
    font-size: 15px;
  }
  #editor:focus { border-color: var(--accent); }
  #editor h1 { font-size: 1.8em; margin: 0.6em 0 0.3em; }
  #editor h2 { font-size: 1.4em; margin: 0.6em 0 0.3em; }
  #editor h3 { font-size: 1.15em; margin: 0.6em 0 0.3em; }
  #editor blockquote {
    border-left: 3px solid var(--accent);
    margin: 0.6em 0;
    padding-left: 14px;
    color: var(--muted);
  }
  #editor pre {
    background: #f0efec;
    padding: 10px 14px;
    border-radius: 6px;
    overflow-x: auto;
  }
  #editor code {
    background: #f0efec;
    padding: 1px 4px;
    border-radius: 4px;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.9em;
  }
  #editor pre code { background: none; padding: 0; }
  #editor a { color: var(--accent); }
  #editor ul, #editor ol { padding-left: 1.4em; }

  .side-pane {
    width: 0;
    overflow: hidden;
    background: var(--panel);
    border-left: 1px solid var(--border);
    transition: width 0.15s ease;
    display: flex;
    flex-direction: column;
  }
  .side-pane.open { width: 42%; min-width: 320px; }
  .side-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  #sideOutput {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 12.5px;
    background: #fbfbfa;
  }

  .doc-list {
    position: absolute;
    top: 54px;
    right: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    width: 260px;
    max-height: 340px;
    overflow-y: auto;
    display: none;
    z-index: 10;
  }
  .doc-list.open { display: block; }
  .doc-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    cursor: pointer;
  }
  .doc-item:hover { background: var(--bg); }
  .doc-item .del {
    color: #b7413e;
    font-size: 12px;
    padding: 2px 6px;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    padding: 0 20px 8px;
  }
</style>
</head>
<body>

<header>
  <h1>📝 Éditeur de texte riche</h1>
  <div class="doc-controls">
    <input type="text" id="docTitle" value="Sans titre" style="width:160px;">
    <button id="saveBtn" class="primary">💾 Sauvegarder</button>
    <div style="position:relative;">
      <button id="loadBtn">📂 Mes documents</button>
      <div class="doc-list" id="docList"></div>
    </div>
    <button id="newBtn">➕ Nouveau</button>
  </div>
</header>

<div class="toolbar">
  <button data-cmd="bold" title="Gras"><b>B</b></button>
  <button data-cmd="italic" title="Italique"><i>I</i></button>
  <button data-cmd="underline" title="Souligné"><u>U</u></button>
  <button data-cmd="strikeThrough" title="Barré"><s>S</s></button>
  <div class="sep"></div>
  <button data-block="h1" title="Titre 1">H1</button>
  <button data-block="h2" title="Titre 2">H2</button>
  <button data-block="h3" title="Titre 3">H3</button>
  <button data-block="p" title="Paragraphe">¶</button>
  <div class="sep"></div>
  <button data-cmd="insertUnorderedList" title="Liste à puces">•—</button>
  <button data-cmd="insertOrderedList" title="Liste numérotée">1.—</button>
  <button data-block="blockquote" title="Citation">"</button>
  <button id="codeBlockBtn" title="Bloc de code">&lt;/&gt;</button>
  <div class="sep"></div>
  <button id="linkBtn" title="Lien">🔗</button>
  <button data-cmd="removeFormat" title="Effacer le format">⌫</button>
  <div class="sep"></div>
  <button id="viewHtml">Voir HTML</button>
  <button id="viewMd">Voir Markdown</button>
</div>

<div class="status" id="status">Prêt</div>

<main>
  <div class="editor-pane">
    <div id="editor" contenteditable="true">
      <h1>Bienvenue</h1>
      <p>Commence à écrire ici. Utilise la barre d'outils au-dessus pour mettre en forme ton texte, puis clique sur <b>Voir HTML</b> ou <b>Voir Markdown</b> pour exporter.</p>
    </div>
  </div>
  <div class="side-pane" id="sidePane">
    <div class="side-header">
      <span id="sideTitle">Aperçu</span>
      <div>
        <button id="copyOutput" style="padding:3px 8px;">Copier</button>
        <button id="downloadOutput" style="padding:3px 8px;">Télécharger</button>
        <button id="closeSide" style="padding:3px 8px;">✕</button>
      </div>
    </div>
    <pre id="sideOutput"></pre>
  </div>
</main>

<script>
const editor = document.getElementById('editor');
const status = document.getElementById('status');
const STORAGE_KEY = 'rte_documents_v1';

function setStatus(msg) {
  status.textContent = msg;
  setTimeout(() => { if (status.textContent === msg) status.textContent = 'Prêt'; }, 2500);
}

// ---------- Toolbar actions ----------
document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
  btn.addEventListener('click', () => {
    editor.focus();
    document.execCommand(btn.dataset.cmd, false, null);
  });
});

document.querySelectorAll('.toolbar button[data-block]').forEach(btn => {
  btn.addEventListener('click', () => {
    editor.focus();
    document.execCommand('formatBlock', false, btn.dataset.block);
  });
});

document.getElementById('codeBlockBtn').addEventListener('click', () => {
  editor.focus();
  document.execCommand('formatBlock', false, 'pre');
});

document.getElementById('linkBtn').addEventListener('click', () => {
  const url = prompt('URL du lien :', 'https://');
  if (url) {
    editor.focus();
    document.execCommand('createLink', false, url);
  }
});

// ---------- HTML -> Markdown conversion ----------
function htmlToMarkdown(node, listDepth = 0) {
  let md = '';
  node.childNodes.forEach(child => {
    md += nodeToMarkdown(child, listDepth);
  });
  return md;
}

function nodeToMarkdown(node, listDepth) {
  if (node.nodeType === Node.TEXT_NODE) {
    return node.textContent;
  }
  if (node.nodeType !== Node.ELEMENT_NODE) return '';

  const tag = node.tagName.toLowerCase();
  const inner = () => htmlToMarkdown(node, listDepth);

  switch (tag) {
    case 'h1': return `# ${inner().trim()}\n\n`;
    case 'h2': return `## ${inner().trim()}\n\n`;
    case 'h3': return `### ${inner().trim()}\n\n`;
    case 'h4': return `#### ${inner().trim()}\n\n`;
    case 'p': return `${inner().trim()}\n\n`;
    case 'br': return `\n`;
    case 'b': case 'strong': return `**${inner().trim()}**`;
    case 'i': case 'em': return `*${inner().trim()}*`;
    case 'u': return `<u>${inner().trim()}</u>`;
    case 's': case 'strike': case 'del': return `~~${inner().trim()}~~`;
    case 'a': return `[${inner().trim()}](${node.getAttribute('href') || ''})`;
    case 'code': return node.parentElement && node.parentElement.tagName.toLowerCase() === 'pre'
      ? inner() : `\`${inner()}\``;
    case 'pre': {
      const codeText = node.textContent.replace(/\n$/, '');
      return `\`\`\`\n${codeText}\n\`\`\`\n\n`;
    }
    case 'blockquote': {
      const lines = inner().trim().split('\n').map(l => `> ${l}`).join('\n');
      return `${lines}\n\n`;
    }
    case 'ul': {
      let out = '';
      node.querySelectorAll(':scope > li').forEach(li => {
        out += `${'  '.repeat(listDepth)}- ${htmlToMarkdown(li, listDepth + 1).trim()}\n`;
      });
      return out + '\n';
    }
    case 'ol': {
      let out = '';
      let i = 1;
      node.querySelectorAll(':scope > li').forEach(li => {
        out += `${'  '.repeat(listDepth)}${i}. ${htmlToMarkdown(li, listDepth + 1).trim()}\n`;
        i++;
      });
      return out + '\n';
    }
    case 'li': return inner();
    case 'div': return `${inner()}\n`;
    case 'hr': return `---\n\n`;
    default: return inner();
  }
}

function getMarkdown() {
  let md = htmlToMarkdown(editor);
  md = md.replace(/\n{3,}/g, '\n\n').trim();
  return md;
}

function getHtml() {
  return editor.innerHTML
    .replace(/></g, '>\n<')
    .trim();
}

// ---------- Side panel (preview / export) ----------
const sidePane = document.getElementById('sidePane');
const sideOutput = document.getElementById('sideOutput');
const sideTitle = document.getElementById('sideTitle');
let currentFormat = 'html';

function openSide(format) {
  currentFormat = format;
  sideTitle.textContent = format === 'html' ? 'Export HTML' : 'Export Markdown';
  sideOutput.textContent = format === 'html' ? getHtml() : getMarkdown();
  sidePane.classList.add('open');
}

document.getElementById('viewHtml').addEventListener('click', () => openSide('html'));
document.getElementById('viewMd').addEventListener('click', () => openSide('md'));
document.getElementById('closeSide').addEventListener('click', () => sidePane.classList.remove('open'));

editor.addEventListener('input', () => {
  if (sidePane.classList.contains('open')) {
    sideOutput.textContent = currentFormat === 'html' ? getHtml() : getMarkdown();
  }
});

document.getElementById('copyOutput').addEventListener('click', () => {
  navigator.clipboard.writeText(sideOutput.textContent).then(() => setStatus('Copié dans le presse-papiers ✓'));
});

document.getElementById('downloadOutput').addEventListener('click', () => {
  const ext = currentFormat === 'html' ? 'html' : 'md';
  const mime = currentFormat === 'html' ? 'text/html' : 'text/markdown';
  const title = document.getElementById('docTitle').value.trim() || 'document';
  const blob = new Blob([sideOutput.textContent], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${title}.${ext}`;
  a.click();
  URL.revokeObjectURL(a.href);
});

// ---------- localStorage persistence ----------
function loadAllDocs() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllDocs(docs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const title = document.getElementById('docTitle').value.trim() || 'Sans titre';
  const docs = loadAllDocs();
  docs[title] = {
    html: editor.innerHTML,
    updatedAt: new Date().toISOString()
  };
  saveAllDocs(docs);
  setStatus(`Document "${title}" sauvegardé ✓`);
});

const newBtn = document.getElementById('newBtn');
let newBtnArmed = false;
let newBtnTimer = null;

newBtn.addEventListener('click', () => {
  if (!newBtnArmed) {
    newBtnArmed = true;
    newBtn.textContent = '⚠️ Confirmer ?';
    newBtn.style.background = '#fde8e6';
    newBtnTimer = setTimeout(() => {
      newBtnArmed = false;
      newBtn.textContent = '➕ Nouveau';
      newBtn.style.background = '';
    }, 3000);
    return;
  }
  clearTimeout(newBtnTimer);
  newBtnArmed = false;
  newBtn.textContent = '➕ Nouveau';
  newBtn.style.background = '';
  editor.innerHTML = '<p>Nouveau document...</p>';
  document.getElementById('docTitle').value = 'Sans titre';
  if (sidePane.classList.contains('open')) {
    sideOutput.textContent = currentFormat === 'html' ? getHtml() : getMarkdown();
  }
  editor.focus();
  setStatus('Nouveau document créé ✓');
});

const docList = document.getElementById('docList');
document.getElementById('loadBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  renderDocList();
  docList.classList.toggle('open');
});

document.addEventListener('click', () => docList.classList.remove('open'));
docList.addEventListener('click', e => e.stopPropagation());

function renderDocList() {
  const docs = loadAllDocs();
  const names = Object.keys(docs);
  docList.innerHTML = '';
  if (names.length === 0) {
    docList.innerHTML = '<div class="doc-item">Aucun document sauvegardé</div>';
    return;
  }
  names.sort((a, b) => new Date(docs[b].updatedAt) - new Date(docs[a].updatedAt));
  names.forEach(name => {
    const item = document.createElement('div');
    item.className = 'doc-item';
    const date = new Date(docs[name].updatedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
    item.innerHTML = `<span>${name}<br><small style="color:#999;">${date}</small></span><span class="del" title="Supprimer">🗑</span>`;
    item.addEventListener('click', (ev) => {
      if (ev.target.classList.contains('del')) {
        ev.stopPropagation();
        delete docs[name];
        saveAllDocs(docs);
        renderDocList();
        setStatus(`Document "${name}" supprimé`);
        return;
      }
      editor.innerHTML = docs[name].html;
      document.getElementById('docTitle').value = name;
      docList.classList.remove('open');
      setStatus(`Document "${name}" chargé ✓`);
    });
    docList.appendChild(item);
  });
}

// autosave every 30s to a "brouillon" slot
setInterval(() => {
  const docs = loadAllDocs();
  docs['__brouillon_auto__'] = { html: editor.innerHTML, updatedAt: new Date().toISOString() };
  saveAllDocs(docs);
}, 30000);

// restore autosave draft on load if present and editor is at default state
window.addEventListener('load', () => {
  const docs = loadAllDocs();
  if (docs['__brouillon_auto__']) {
    setStatus('Brouillon auto-sauvegardé disponible dans "Mes documents"');
  }
});
</script>

</body>
</html>
