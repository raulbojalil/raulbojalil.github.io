<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securing Static Jamstack Sites — Raúl Bojalil</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --border-color: #e2e8f0;
            --max-width: 800px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); line-height: 1.7; }

        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 1.5rem; }
        .header-content { max-width: var(--max-width); margin: 0 auto; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--text-main); text-decoration: none; }

        .container { max-width: var(--max-width); margin: 2rem auto; padding: 2rem; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        .back-btn { display: inline-block; margin-bottom: 1.5rem; color: var(--accent); text-decoration: none; font-weight: 600; }
        .tag { display: inline-block; background: var(--accent); color: white; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
        .post-meta { font-size: 0.85rem; color: var(--text-muted); margin: 0.5rem 0 1rem 0; }
        img.cover { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; margin: 1rem 0; }
        
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-left: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a class="logo" href="/">MULTI-THREADER'S BLOG</a>
        </div>
    </header>

    <main class="container">
        <a class="back-btn" href="/">← Back to all posts</a>
        <div><span class="tag">Cybersecurity</span></div>
        <h1 style="font-size:2.2rem; margin-top:0.4rem;">Securing Static Jamstack Sites</h1>
        <div class="post-meta">By Marta Sanz • 2026-08-20</div>
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=80" class="cover" alt="Securing Static Jamstack Sites">
        <div class="markdown-body">
            <h1>Static Site Security</h1>
<p>Eliminating server-side databases significantly reduces attack surfaces for static blogs hosted on platforms like GitHub Pages.</p>

        </div>
    </main>

</body>
</html>
