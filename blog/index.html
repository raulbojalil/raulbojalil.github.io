<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="#" id="home-link">My Blog</a></h1>
      <p class="tagline">Thoughts, notes & experiments</p>
    </header>

    <main>
      <!-- Post list view -->
      <section id="post-list" class="view">
        <h2>Latest Posts</h2>
        <ul id="posts"></ul>
      </section>

      <!-- Single post view -->
      <section id="post-view" class="view hidden">
        <button id="back-btn" class="back-btn">← Back to posts</button>
        <article id="post-content"></article>
      </section>
    </main>

    <footer>
      <p>Built with Markdown + marked.js · Hosted on GitHub Pages</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
